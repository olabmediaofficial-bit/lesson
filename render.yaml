services:
  - type: web
    name: guitar-lesson-room
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: lesson-room-data
      mountPath: /var/data
      sizeGB: 1
