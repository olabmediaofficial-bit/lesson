name = "guitar-lesson-room"
compatibility_date = "2026-08-01"
main = "worker.js"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/files/*"]

[[d1_databases]]
binding = "LESSON_DB"
database_name = "lesson-db"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

[[r2_buckets]]
binding = "LESSON_FILES"
bucket_name = "lesson-files"
